<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi AI Agents - Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 18px; font-weight: 600; }
        .status { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
        .container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: #1e293b; border-right: 1px solid #334155; padding: 16px; overflow-y: auto; }
        .sidebar h3 { font-size: 13px; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .question-btn { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 8px; background: #334155; border: 1px solid #475569; border-radius: 8px; color: #e2e8f0; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .question-btn:hover { background: #475569; border-color: #60a5fa; }
        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
        .user { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: #334155; border-bottom-left-radius: 4px; }
        .input-area { padding: 16px 24px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 12px; }
        input { flex: 1; padding: 12px 16px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { padding: 12px 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
        button:hover { background: #2563eb; }
        .empty-state { text-align: center; color: #64748b; margin-top: 40px; }
        .empty-state h2 { font-size: 20px; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="status" id="status"></div>
        <h1>WiFi AI Agents - Chat Conversacional</h1>
    </div>
    <div class="container">
        <div class="sidebar">
            <h3>Preguntas Guía</h3>
            <button class="question-btn" onclick="askQuestion(this.textContent)">¿Qué AP presentan más inestabilidad o desconexiones?</button>
            <button class="question-btn" onclick="askQuestion(this.textContent)">¿Qué zonas concentran más clientes y tráfico?</button>
            <button class="question-btn" onclick="askQuestion(this.textContent)">¿En qué horas aumenta la autenticación o la desconexión?</button>
            <button class="question-btn" onclick="askQuestion(this.textContent)">¿Qué señales permiten anticipar fallas o congestión?</button>
            <button class="question-btn" onclick="askQuestion(this.textContent)">¿Cómo priorizar mantenimiento o inversión usando estos datos?</button>
            <button class="question-btn" onclick="askQuestion('Dame un resumen general')">Dame un resumen general</button>
        </div>
        <div class="chat-area">
            <div class="messages" id="messages">
                <div class="empty-state">
                    <h2>💬 Chat WiFi AI</h2>
                    <p>Selecciona una pregunta guía o escribe tu consulta</p>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="queryInput" placeholder="Escribe tu consulta..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>
    <script>
        const API_URL = 'http://localhost:8000';
        let messageCount = 0;

        async function checkHealth() {
            try {
                const res = await fetch(`${API_URL}/health`);
                document.getElementById('status').style.background = res.ok ? '#22c55e' : '#ef4444';
            } catch {
                document.getElementById('status').style.background = '#ef4444';
            }
        }
        checkHealth();
        setInterval(checkHealth, 5000);

        function askQuestion(q) {
            document.getElementById('queryInput').value = q;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            if (!query) return;
            input.value = '';

            const messages = document.getElementById('messages');
            if (messageCount === 0) messages.innerHTML = '';
            messageCount++;

            messages.innerHTML += `<div class="message user">${escapeHtml(query)}</div>`;
            messages.innerHTML += `<div class="message bot" id="loading">⏳ Procesando...</div>`;
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query})
                });
                const data = await res.json();
                document.getElementById('loading').innerHTML = escapeHtml(data.response);
            } catch {
                document.getElementById('loading').innerHTML = '❌ Error de conexión con el servidor';
            }
            messages.scrollTop = messages.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
        }
    </script>
</body>
</html>
